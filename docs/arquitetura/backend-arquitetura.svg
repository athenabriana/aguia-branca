<svg viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="900" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">INOVAGAB — Arquitetura do backend (Sprint 2)</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#64748b">App Android → API .NET 8 (Clean Architecture) → MongoDB · Google Gemini</text>

  <!-- App Android -->
  <rect x="330" y="80" width="320" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="490" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">App Android (Kotlin + Jetpack Compose)</text>
  <text x="490" y="126" text-anchor="middle" font-size="12" fill="#4338ca">Remote*Repository · Retrofit + OkHttp · TokenStore (Keystore)</text>

  <line x1="490" y1="150" x2="490" y2="182" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="510" y="170" font-size="11.5" fill="#334155">HTTPS · JSON · Bearer JWT</text>

  <!-- Outer box: Api -->
  <rect x="80" y="182" width="820" height="560" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="100" y="206" font-size="13" font-weight="700" fill="#0f172a">Api</text>
  <text x="100" y="222" font-size="11" fill="#64748b">Controllers · Middleware (erros, correlação) · Auth (JWT/policies) · Rate limiter · Swagger</text>

  <rect x="110" y="234" width="760" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="490" y="264" text-anchor="middle" font-size="12.5" fill="#0f172a">AuthController · GuidelinesController · IdeasController · ProjectsController · ReportsController · UsersController</text>

  <line x1="490" y1="286" x2="490" y2="312" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="520" y="304" font-size="11.5" fill="#334155">Commands / Queries (sem MediatR)</text>

  <!-- Application -->
  <rect x="110" y="312" width="760" height="150" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="130" y="334" font-size="13" font-weight="700" fill="#0e7490">Application</text>
  <text x="130" y="350" font-size="11" fill="#155e75">Handlers por feature (Auth, Guidelines, Ideas, Projects, Reports, Users) · FluentValidation · Result&lt;T&gt;/Error</text>

  <rect x="130" y="360" width="330" height="86" rx="8" fill="#ffffff" stroke="#67e8f9"/>
  <text x="295" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#0e7490">Casos de uso de negócio</text>
  <text x="295" y="398" text-anchor="middle" font-size="10.5" fill="#334155">Gamificação · BadgeEvaluator · ProjectCompletionAutomation</text>
  <text x="295" y="414" text-anchor="middle" font-size="10.5" fill="#334155">ReportCalculator (dashboard, golden tests)</text>
  <text x="295" y="430" text-anchor="middle" font-size="10.5" fill="#334155">GenerateInsightsHandler · InsightPromptBuilder</text>

  <rect x="500" y="360" width="350" height="86" rx="8" fill="#ffffff" stroke="#67e8f9"/>
  <text x="675" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#0e7490">Abstrações (portas)</text>
  <text x="675" y="398" text-anchor="middle" font-size="10.5" fill="#334155">IUserRepository · IIdeaRepository · IProjectRepository…</text>
  <text x="675" y="414" text-anchor="middle" font-size="10.5" fill="#334155">IUnitOfWork · ITokenService · IIdentityService</text>
  <text x="675" y="430" text-anchor="middle" font-size="10.5" fill="#334155">IInsightGenerator · IInsightCache · IInsightQuota</text>

  <line x1="490" y1="462" x2="490" y2="490" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="510" y="482" font-size="11.5" fill="#334155">depende de (entidades, regras)</text>

  <!-- Domain -->
  <rect x="330" y="490" width="320" height="92" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="490" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Domain</text>
  <text x="490" y="530" text-anchor="middle" font-size="11" fill="#78350f">Entidades · ValueObjects (Ice, FieldChange) · Enums</text>
  <text x="490" y="546" text-anchor="middle" font-size="11" fill="#78350f">Regras (BadgeEvaluator, PointsRules)</text>
  <text x="490" y="566" text-anchor="middle" font-size="10.5" fill="#b45309" font-style="italic">sem dependência de ASP.NET / EF / MongoDB</text>

  <!-- Infrastructure -->
  <rect x="110" y="606" width="760" height="112" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="130" y="628" font-size="13" font-weight="700" fill="#5b21b6">Infrastructure</text>
  <text x="130" y="644" font-size="11" fill="#4c1d95">implementa as portas da Application (inversão de dependência) e integra os serviços externos</text>
  <text x="130" y="664" font-size="10.5" fill="#334155">AppDbContext (EF Core + MongoDB.EntityFrameworkCore) · MongoUnitOfWork (transações, retry) · IndexInitializer</text>
  <text x="130" y="680" font-size="10.5" fill="#334155">MongoUserStore · JwtTokenService (ASP.NET Identity + JWT HS256) · DatabaseSeeder</text>
  <text x="130" y="696" font-size="10.5" fill="#334155">GeminiClient · InsightCache/InsightQuota (Ai/) · AddStandardResilienceHandler (timeout, retry, circuit breaker)</text>

  <line x1="490" y1="606" x2="490" y2="582" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="500" y="600" font-size="11" fill="#334155">implementa as interfaces do Domain/Application</text>

  <!-- Mongo & Gemini -->
  <line x1="330" y1="700" x2="230" y2="760" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="150" y="735" font-size="11" fill="#334155">Mongo Wire Protocol</text>
  <text x="150" y="749" font-size="11" fill="#334155">(replica set — transações)</text>

  <line x1="650" y1="700" x2="750" y2="760" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="700" y="735" font-size="11" fill="#334155">HTTPS</text>
  <text x="655" y="749" font-size="11" fill="#334155">header x-goog-api-key</text>

  <rect x="100" y="760" width="260" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="230" y="786" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">MongoDB</text>
  <text x="230" y="804" text-anchor="middle" font-size="11" fill="#15803d">replica set (rs0) — transações</text>
  <text x="230" y="820" text-anchor="middle" font-size="11" fill="#15803d">users · guidelines · ideas · projects</text>
  <text x="230" y="836" text-anchor="middle" font-size="11" fill="#15803d">pointEvents · aiInsights · aiUsage</text>

  <rect x="620" y="760" width="260" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="750" y="786" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Google Gemini API</text>
  <text x="750" y="804" text-anchor="middle" font-size="11" fill="#1d4ed8">generateContent</text>
  <text x="750" y="820" text-anchor="middle" font-size="11" fill="#1d4ed8">modelo gemini-3.1-flash-lite</text>
  <text x="750" y="836" text-anchor="middle" font-size="11" fill="#1d4ed8">(configurável — Gemini:Model)</text>

  <text x="490" y="880" text-anchor="middle" font-size="10.5" fill="#94a3b8">Regra de dependência: Api → Application → Domain ← Infrastructure. O Domain não conhece ASP.NET, EF Core, MongoDB nem HTTP (verificado por teste de arquitetura).</text>
</svg>
